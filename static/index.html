<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ClawBot 多用户登录 Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; text-align: center; }
  button { font-size: 16px; padding: 8px 20px; cursor: pointer; }
  #qr img { width: 220px; height: 220px; margin-top: 20px; }
  #status { margin-top: 12px; color: #666; }
  #error { color: #c00; margin-top: 12px; }
  #qrurl { margin-top: 8px; font-size: 12px; color: #999; word-break: break-all; }
  #lxnsBind { display: none; margin-top: 24px; }
  #lxnsBind.visible { display: block; }
  #lxnsBind a { display: inline-block; padding: 8px 20px; background: #06c; color: #fff; text-decoration: none; border-radius: 4px; }
</style>
</head>
<body>
  <h1>扫码绑定你自己的 ClawBot</h1>
  <p>每个访客点击下面的按钮都会拿到属于自己的二维码，绑定的是你自己的微信账号，互不影响。</p>
  <button id="start">开始登录</button>
  <div id="qr"></div>
  <div id="qrurl"></div>
  <div id="status"></div>
  <div id="error"></div>

  <div id="lxnsBind">
    <a id="lxnsBindLink" href="#">绑定 maimai 查分账号</a>
  </div>

<script>
// When this page is deployed separately from web_multi.py (e.g. this file
// on Cloudflare Pages, the backend on a VPS), point this at the backend's
// full URL. Leave empty for local dev, where both are served from the
// same origin by web_multi.py itself.
const API_BASE = "https://api.kumikoo.me";

const startBtn = document.getElementById("start");
const qrBox = document.getElementById("qr");
const qrUrlBox = document.getElementById("qrurl");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");
const lxnsBindBox = document.getElementById("lxnsBind");
const lxnsBindLink = document.getElementById("lxnsBindLink");

// state=<wechat user_id> is how /api/save-token (via the oauth-callback
// Worker) knows whose token it just received — see web_multi.py.
function lxnsAuthorizeUrl(wechatUserId) {
  const params = new URLSearchParams({
    response_type: "code",
    client_id: "ea49b0bc-ac0c-40be-839e-8b57f9670ef2",
    redirect_uri: "https://api.kumikoo.me/callback",
    scope: "read_user_profile read_player write_player",
    state: wechatUserId,
  });
  return `https://maimai.lxns.net/oauth/authorize?${params}`;
}

const STATUS_TEXT = {
  starting: "正在生成二维码...",
  waiting: "请使用微信扫码",
  scanned: "已扫码，请在手机上确认",
  confirmed: "登录成功！可以在微信 ClawBot 窗口里发 /help 试试",
  expired: "二维码已过期，请重新开始",
  error: "出错了",
};

let pollTimer = null;
let shownQrUrl = null;

// The server renders the QR itself (qr_png, a data: URI) because
// qrcode_img_content is a plain link, not an image.
function showQr(pngDataUri, url) {
  if (url === shownQrUrl) return;  // don't re-render on every poll tick
  shownQrUrl = url;

  qrBox.innerHTML = `<img src="${pngDataUri}" alt="QR code">`;
  qrUrlBox.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
}

async function poll(loginId) {
  const res = await fetch(`${API_BASE}/api/login/${loginId}`);
  const data = await res.json();

  statusBox.textContent = STATUS_TEXT[data.status] || data.status;
  errorBox.textContent = data.error || "";

  if (data.qr_png && data.status === "waiting") {
    showQr(data.qr_png, data.qr_url);
  }

  if (["confirmed", "expired", "error"].includes(data.status)) {
    clearInterval(pollTimer);
    if (data.status !== "confirmed") {
      qrBox.replaceChildren();
      qrUrlBox.replaceChildren();
      shownQrUrl = null;
    }
  }

  if (data.status === "confirmed" && data.user_id) {
    lxnsBindLink.href = lxnsAuthorizeUrl(data.user_id);
    lxnsBindBox.classList.add("visible");
  }
}

startBtn.addEventListener("click", async () => {
  startBtn.disabled = true;
  qrBox.innerHTML = "";
  errorBox.textContent = "";
  statusBox.textContent = STATUS_TEXT.starting;

  const res = await fetch(`${API_BASE}/api/login`, { method: "POST" });
  const { login_id } = await res.json();

  clearInterval(pollTimer);
  pollTimer = setInterval(() => poll(login_id), 1500);
  startBtn.disabled = false;
});
</script>
</body>
</html>
